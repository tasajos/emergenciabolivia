# Project-wide Gradle settings.

# Memory settings
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Performance settings
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX settings
android.useAndroidX=true
android.enableJetifier=true
android.jetifier.ignorelist=bcprov-jdk15on

# React Native settings
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=false
hermesEnabled=true

# Network timeouts
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000

# Disable JLink
android.disableJlinkForLibraries=true

# Kotlin Configuration
kotlin.code.style=official

# Signing config (mantén tus credenciales)
MYAPP_RELEASE_STORE_FILE=emergenciabol.keystore
MYAPP_RELEASE_KEY_ALIAS=tasajos
MYAPP_RELEASE_STORE_PASSWORD=vallegrande2135
MYAPP_RELEASE_KEY_PASSWORD=vallegrande2135

# NOTA: NO incluyas org.gradle.java.home - Gradle usará el Java del sistema automáticamente